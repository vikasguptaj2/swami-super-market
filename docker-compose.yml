services:
  postgres:
    image: postgres:18-alpine
    container_name: swami_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: swami_super_market
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
